<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Royale - Lobbies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Skill Royale</h1>
        <div id="local-currency">Loading Rates...</div>
    </header>

    <div id="lobby-container">
        </div>

    <div id="game-container" class="hidden">
        <h2>Hyper-Typing Royale</h2>
        <div id="countdown">Waiting for 64 players...</div>
        <div id="typing-area">
            <p id="target-text"></p>
            <input type="text" id="player-input" placeholder="Start typing here...">
        </div>
        <div id="leaderboard"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
