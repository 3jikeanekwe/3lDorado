<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="64-Player Tournament Casino - Compete in 3 elimination rounds for massive prizes" />
    <title>Tournament Casino - 64 Players, 8 Winners</title>
    
    <!-- Prevent text from showing before React loads -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      
      /* Loading screen */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-size: 24px;
        z-index: 9999;
      }
      
      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top: 4px solid white;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-right: 16px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide root until React loads */
      #root:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading indicator -->
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading Tournament Casino...</div>
    </div>
    
    <!-- React app mounts here -->
    <div id="root"></div>
    
    <!-- Vite script - MUST be type="module" -->
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Remove loading screen when React loads -->
    <script>
      window.addEventListener('load', () => {
        const loading = document.getElementById('loading');
        const root = document.getElementById('root');
        
        // Check if React has mounted
        const checkReactMounted = setInterval(() => {
          if (root && root.children.length > 0) {
            loading.style.display = 'none';
            clearInterval(checkReactMounted);
          }
        }, 100);
        
        // Fallback: hide loading after 3 seconds regardless
        setTimeout(() => {
          loading.style.display = 'none';
          clearInterval(checkReactMounted);
        }, 3000);
      });
    </script>
  </body>
</html>
